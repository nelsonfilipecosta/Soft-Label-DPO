# Smoke test
#
# 10 DPO steps on TRL's quick-start dataset to check the training pipeline works end to end.
# The objective is to ensure the first logged step has loss ≈ 0.693 and margins ≈ 0.

# Model
model_name_or_path: allenai/OLMo-2-0425-1B-SFT
model_init_kwargs:
  dtype: bfloat16  # TRL loads in float32 when this is unset

# Data
dataset_name: trl-lib/ultrafeedback_binarized
dataset_train_split: train

# DPO
beta: 0.1
loss_type: [sigmoid]  # standard DPO

# Training
max_train_samples: 20
max_steps: 10
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
learning_rate: 1.0e-6
lr_scheduler_type: constant
max_length: 1024
gradient_checkpointing: true
bf16: true
seed: 42

# Logging and saving
output_dir: outputs/smoke_test
report_to: wandb
run_name: smoke-test
logging_steps: 1
logging_first_step: true
save_strategy: "no"

# Environment
env:
  WANDB_PROJECT: soft-label-dpo
