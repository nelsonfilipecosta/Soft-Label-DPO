[project]
name = "soft-label-dpo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "peft>=0.21.2",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "torch>=2.14.1",
    "transformers>=4.48",
    "trl>=1.14.2",
    "wandb>=0.30.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12"]
build-backend = "uv_build"
